<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 760"
  role="img"
  aria-labelledby="architecture-title architecture-description"
>
  <title id="architecture-title">A Auth system architecture</title>
  <desc id="architecture-description">
    OAuth clients and agents enter through CloudFront and API Gateway to the
    A Auth Rust protocol runtime. The React user interface uses the same edge
    and runtime. The runtime federates with enterprise identity providers,
    stores authority and replay state in DynamoDB, and uses AWS KMS for signing
    and encryption. MCP and OAuth resource servers receive access tokens from
    clients and validate them with metadata, JWKS, or the resource-server SDK.
  </desc>

