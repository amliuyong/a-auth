name: Release conformance watchdog

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-conformance-watchdog
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor continuous conformance evidence
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      CONFORMANCE_DEPLOYMENT_VERSION: >-
        ${{ vars.CONFORMANCE_DEPLOYMENT_VERSION }}
      CONFORMANCE_SCHEDULE_ENABLED: >-
        ${{ vars.CONFORMANCE_SCHEDULE_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Monitor release conformance recurrence and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_conformance.py monitor \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --schedule-enabled "$CONFORMANCE_SCHEDULE_ENABLED" \
            --deployment-version "$CONFORMANCE_DEPLOYMENT_VERSION" \
            --policy .github/conformance/policy.json \
            --body "$RUNNER_TEMP/release-conformance-monitor.md"
