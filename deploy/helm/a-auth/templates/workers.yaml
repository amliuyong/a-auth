{{- if .Values.workers.enabled }}
{{- $root := . }}
{{- range $kind := list "governance" "events" "smtp" "ssf" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a-auth.name" $root }}-{{ $kind }}
  labels:
    {{- include "a-auth.labels" $root | nindent 4 }}
spec:
  replicas: {{ $root.Values.workers.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      a-auth.io/plane: {{ $kind }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-auth
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        a-auth.io/plane: {{ $kind }}
      annotations:
        a-auth.io/config-sha256: {{ $root.Values.runtime | mustToJson | sha256sum | quote }}
        a-auth.io/rollout-revision: {{ $root.Values.rolloutRevision | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 270
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "a-auth.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - work-{{ $kind }}
            - /etc/a-auth/runtime/runtime.json
          ports:
            - name: probes
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: probes
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: probes
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /etc/a-auth/runtime
              readOnly: true
            - name: database
              mountPath: /etc/a-auth/database
              readOnly: true
            - name: crypto
              mountPath: /etc/a-auth/crypto
              readOnly: true
            - name: signing
              mountPath: /etc/a-auth/signing
              readOnly: true
            - name: administrators
              mountPath: /etc/a-auth/administrators
              readOnly: true
            - name: external
              mountPath: /etc/a-auth/external
              readOnly: true
      volumes:
        - name: runtime
          configMap:
            name: {{ include "a-auth.name" $root }}-runtime
            defaultMode: 0444
        - name: database
          secret:
            secretName: {{ $root.Values.secrets.database }}
            defaultMode: 0440
        - name: crypto
          secret:
            secretName: {{ $root.Values.secrets.webCrypto }}
            defaultMode: 0440
            items:
              {{- range $purpose := list "server_key" "governance_key" "ciba" "outbox" "ssf" }}
              - key: {{ index $root.Values.runtime.secrets $purpose | quote }}
                path: {{ index $root.Values.runtime.secrets $purpose | quote }}
              {{- end }}
        - name: signing
          secret:
            secretName: {{ $root.Values.secrets.signing }}
            defaultMode: 0440
        - name: administrators
          secret:
            secretName: {{ $root.Values.secrets.administrators }}
            defaultMode: 0440
        - name: external
          secret:
            secretName: {{ $root.Values.secrets.external }}
            defaultMode: 0440
{{- end }}
{{- end }}
