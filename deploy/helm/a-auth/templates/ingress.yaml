{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "a-auth.name" . }}
  labels:
    {{- include "a-auth.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "runtime.host is required" .Values.runtime.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.runtime.host | quote }}
      http:
        paths:
          - path: /token
            pathType: Exact
            backend:
              service:
                name: {{ include "a-auth.name" . }}-token
                port:
                  name: protocol
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "a-auth.name" . }}-web
                port:
                  name: protocol
{{- end }}
