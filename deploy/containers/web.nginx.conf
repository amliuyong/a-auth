worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format access_json escape=json
        '{"event":"frontend_access","method":"$request_method","status":$status,"elapsed_seconds":$request_time}';
    access_log /dev/stdout access_json;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    server {
        listen 8083;
        root /usr/share/nginx/html;

        location = /health/frontend {
            access_log off;
            return 204;
        }

        # Only the public browser pages resolve to the SPA.
        location ~ ^/(?:login|invite|consent|recover|account|approve|error)?$ {
            limit_except GET { deny all; }
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }
        location /assets/ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }

        # Keep private families and the separate token plane closed here.
        location = /admin { return 404; }
        location /admin/ { return 404; }
        location = /scim { return 404; }
        location /scim/ { return 404; }
        location = /token { return 404; }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_read_timeout 35s;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
