[package]
name = "spike-lambda-coldstart"
version = "0.0.0"
edition = "2021"
publish = false
description = "P-1 spike:Rust Lambda 冷启动 + 签发路径(KMS ES256 Sign + der_to_jose)实测,拍板语言选型(DESIGN §10)。非生产。"

[workspace]

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
agent-auth-infra-core = { path = "../../crates/infra-core" }
lambda_runtime = "0.13"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
